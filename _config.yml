# GitHub Pages mirror — the zero-maintenance configuration, all of it in this file
# plus two small committed style files under _sass/. Theme: Just the Docs (pinned),
# which adds full-text search, a navigation sidebar, and documentation typography.
# Pages' own defaults do the rest: relative .md links become page links, the README
# serves as the front page, each page takes its title from its first heading, and
# every push republishes automatically. Nothing here needs editing when content changes.
title: "Model Act — Frontier AI Public Welfare Offenses"
description: "A public-domain model state statute extending responsible-officer liability to frontier AI — drafted in public, with its audits, errata, and full drafting record published beside it."

url: "https://frontieraiaccountabilityproject.github.io"
baseurl: "/model-act"
lang: en

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag    # canonical URLs, meta descriptions, Open Graph, JSON-LD — per page, automatic
  - jekyll-sitemap    # sitemap.xml for search engines, regenerated on every push

# Just the Docs
color_scheme: statute
search_enabled: true
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "The file repository — authoritative record":
    - "https://github.com/FrontierAIAccountabilityProject/model-act"
footer_content: "Public domain (CC0) · v3.4 tagged, checksums in the ledger · This site mirrors the repository; the repository is the authoritative record."

# The sidebar is a curated reading order, ten entries, not a directory listing:
# the reviewer page, the packets, the long documents, the glossary, the map.
# Everything else stays one search or one link away. Each entry is named by exact
# path — the matcher takes whole paths, not prefixes.
defaults:
  - scope:
      path: ""
    values:
      nav_exclude: true
  - scope:
      path: "REVIEWERS.md"
    values: { nav_exclude: false, nav_order: 1, title: "For reviewers" }
  - scope:
      path: "packets/README.md"
    values: { nav_exclude: false, nav_order: 2, title: "The packets" }
  - scope:
      path: "packets/criminal_law.md"
    values: { nav_exclude: false, nav_order: 3, title: "The criminal-law packet" }
  - scope:
      path: "docs/the_case.md"
    values: { nav_exclude: false, nav_order: 4, title: "The case" }
  - scope:
      path: "docs/the_statute_translated.md"
    values: { nav_exclude: false, nav_order: 5, title: "The statute, translated" }
  - scope:
      path: "docs/questions.md"
    values: { nav_exclude: false, nav_order: 6, title: "Questions" }
  - scope:
      path: "docs/the_definition.md"
    values: { nav_exclude: false, nav_order: 7, title: "The definition" }
  - scope:
      path: "docs/known_objections.md"
    values: { nav_exclude: false, nav_order: 8, title: "Known objections" }
  - scope:
      path: "standards/what_these_words_mean.md"
    values: { nav_exclude: false, nav_order: 9, title: "The glossary" }
  - scope:
      path: "MAP.md"
    values: { nav_exclude: false, nav_order: 10, title: "Everything — the full index" }
  - scope:
      path: "archive"         # superseded versions: reachable by link, never by search
    values:
      search_exclude: true
  - scope:
      path: "audit/record.md" # the 364KB frozen record would drown the search index
    values:
      search_exclude: true
