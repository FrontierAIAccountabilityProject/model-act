# GitHub Pages mirror — the zero-maintenance configuration, all of it in this file
# plus two small committed style files under _sass/. Theme: Just the Docs (pinned),
# which adds full-text search, a navigation sidebar, and documentation typography.
# Pages' own defaults do the rest: relative .md links become page links, the README
# serves as the front page, each page takes its title from its first heading, and
# every push republishes automatically. Nothing here needs editing when content changes.
title: "Model Act — Frontier AI Public Welfare Offenses"
description: "A public-domain model state statute extending responsible-officer liability to frontier AI — drafted in public, with its audits, errata, and full drafting record published beside it."

url: "https://frontieraiaccountabilityproject.github.io"
baseurl: "/model-act"
lang: en

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag    # canonical URLs, meta descriptions, Open Graph, JSON-LD — per page, automatic
  - jekyll-sitemap    # sitemap.xml for search engines, regenerated on every push

# Not built into the site. Jekyll already ignores _-prefixed directories, so
# _internal/, _to_delete/ and _patches/ are safe by convention rather than by a
# list somebody has to remember to update -- which is why they are named that way.
# These are the ones that need saying out loud.
exclude:
  - CLAUDE.md            # the operating instructions are repository content, not a page
  - CLAUDE.local.md
  - tools/
  - version.json
  - _retired/            # retired pages: kept in the repository, not built as pages.
                         # NOT gitignored -- that is the whole point. _internal/ is
                         # gitignored, so moving a tracked page there deletes it from
                         # the repository on the next commit. Keeping a file out of
                         # Jekyll and keeping it out of git are two different things.

# Just the Docs
color_scheme: statute
search_enabled: true
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "The file repository — authoritative record":
    - "https://github.com/FrontierAIAccountabilityProject/model-act"
footer_content: "A publication of the Frontier AI Accountability Project · Public domain (CC0) · v3.4.2 current, checksums in the ledger · This site mirrors the repository; the repository is the authoritative record."

# The sidebar is a curated reading order, nine entries, not a directory listing:
# the reviewer page, the review packets, the long documents, the glossary, the map.
# Everything else stays one search or one link away. Each entry is named by exact
# path — the matcher takes whole paths, not prefixes.
#
# The packets are the one nested entry: "The review packets" carries the index page
# and every lane packet hangs beneath it as a child, so a fifth lane costs a click
# rather than a chapter. Children are matched to the parent by its exact title.
defaults:
  # Every page now declares its own nav placement in its front matter, so the old
  # "exclude everything, then re-include by path" block is gone. It listed thirty
  # paths -- REVIEWERS.md, packets/*, docs/* -- every one of which moved on
  # 26 August 2026, so its first rule (nav_exclude: true for path "") was the only
  # one still matching and the sidebar rendered empty.
  - scope:
      path: "archive"          # superseded versions: reachable by link, never by search,
    values:                      # and never in the sidebar -- seven files there carried no
      search_exclude: true       # front matter, so each rendered as a stray top-level entry
      nav_exclude: true
  - scope:
      path: "corrections/drafting-history.md"   # 356KB frozen record; it would drown the index
    values:
      search_exclude: true
